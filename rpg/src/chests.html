<dialog id="rpg-chest" class="rpg-chest" aria-labelledby="chest-title">
 <header><div><small id="chest-city"></small><h2 id="chest-title">Treasure Chest</h2></div><button type="button" id="chest-close" aria-label="Close chest">✕</button></header>
 <div id="chest-art" class="chest-art"><img src="assets/chests/golden.webp" alt=""></div><p id="chest-detail"></p>
 <div id="chest-loot" class="chest-loot" aria-label="Chest rewards"></div><p id="chest-message" role="status" aria-live="polite"></p>
 <button type="button" id="chest-open">Open Chest</button>
</dialog>
